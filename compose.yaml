# Personal Linux launcher. Host networking binds only host loopback, with no data volume.
# On macOS/Windows use `npm run dev:up` (native), or enable Docker host networking.
name: nightbuoy-portable
services:
  client:
    image: nightbuoy:portable
    build: .
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NIGHTBUOY_LISTEN: 127.0.0.1:8080
      NIGHTBUOY_PUBLIC_URL: http://localhost:8080
    command: [nightbuoy, portable]
